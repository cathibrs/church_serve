# Publicação no Netlify. O site (React) e a API (/api/*, Netlify Functions) ficam em app/web.
[build]
  base = "app/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # A verificação de segredos do Netlify barra o build quando acha, em qualquer arquivo, o valor
  # de uma variável marcada como secreta. Estas não são segredo (nome do branch e endereços
  # públicos do login) e seus valores são texto comum, como "production". DATABASE_URL e
  # DATABASE_URL_UNPOOLED continuam verificadas.
  SECRETS_SCAN_OMIT_KEYS = "NEON_BRANCH,NEON_BRANCH_ID,NEON_FUNCTION_HOST_SUFFIX,NEON_AUTH_BASE_URL,NEON_AUTH_JWKS_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# "netlify dev" (na raiz do projeto) sobe o Vite e a API juntos em http://localhost:8888
[dev]
  command = "node app/web/node_modules/vite/bin/vite.js app/web"
  targetPort = 5173
  port = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
